[project]
name = "audible-dictionary"
version = "0.1.0"
# NumPy 2.5 requires Python 3.12+, while Kokoro excludes Python 3.13+.
requires-python = ">=3.12,<3.13"
dependencies = [
    "jaxtyping>=0.3.11",
    "kokoro>=0.9.4",
    "numpy>=2.5.3",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["audibledict/*"]
